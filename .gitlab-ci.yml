variables:
  NODE_VERSION: "20"
  FF_USE_LEGACY_KUBERNETES_EXECUTION_STRATEGY: "true"

stages:
  - lint
  - test
  - build
  - e2e
  - deploy


# BACKEND LINT


backend-lint:
  stage: lint
  image: node:${NODE_VERSION}
  cache:
    key: backend-npm-cache
    paths:
      - backend/node_modules/
  before_script:
    - cd backend
    - npm ci
  script:
    - npm run lint || echo "No lint script, skipping..."
  only:
    - main
    - develop
    - merge_requests
    - /^feature\/.*$/


# FRONTEND LINT


frontend-lint:
  stage: lint
  image: node:${NODE_VERSION}
  cache:
    key: frontend-npm-cache
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run lint
  only:
    - main
    - develop
    - merge_requests
    - /^feature\/.*$/


# BACKEND TESTS


backend-test:
  stage: test
  image: node:${NODE_VERSION}
  cache:
    key: backend-npm-cache
    paths:
      - backend/node_modules/
  before_script:
    - cd backend
    - npm ci
  script:
    - npm test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    paths:
      - backend/coverage/
      - backend/test-results.xml
    reports:
      junit: backend/test-results.xml
    expire_in: 7 days
  only:
    - main
    - develop
    - merge_requests
    - /^feature\/.*$/


# FRONTEND TESTS


frontend-test:
  stage: test
  image: node:${NODE_VERSION}
  cache:
    key: frontend-npm-cache
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm test
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    paths:
      - frontend/coverage/
      - frontend/test-results.xml
    reports:
      junit: frontend/test-results.xml
    expire_in: 7 days
  only:
    - main
    - develop
    - merge_requests
    - /^feature\/.*$/


# BUILD FRONTEND


build-frontend:
  stage: build
  image: node:${NODE_VERSION}
  cache:
    key: frontend-npm-cache
    paths:
      - frontend/node_modules/
  dependencies:
    - backend-test
    - frontend-test
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 7 days
  only:
    - main
    - develop
    - merge_requests
    - /^feature\/.*$/


# E2E TESTS


e2e-tests:
  stage: e2e
  image: node:${NODE_VERSION}
  dependencies:
    - build-frontend
  before_script:
    - apt-get update && apt-get install -y curl bash || true
    - npm ci
    - cd backend && npm ci
    - cd ../frontend && npm ci
    - cd ..
    - npx playwright install --with-deps chromium firefox webkit
  script:
    - |
      cd backend
      npm start > ../backend.log 2>&1 &
      echo $! > ../backend.pid
      cd ..
    - |
      cd frontend
      npm run dev -- --host 0.0.0.0 --port 5173 > ../frontend.log 2>&1 &
      echo $! > ../frontend.pid
      cd ..
    - |
      echo "Waiting for backend server..."
      timeout 60 bash -c 'until curl -f http://localhost:3000/api/health; do sleep 2; done'
      echo "Waiting for frontend server..."
      timeout 60 bash -c 'until curl -f http://localhost:5173; do sleep 2; done'
    - npm run test:e2e
  after_script:
    - |
      if [ -f backend.pid ]; then
        kill $(cat backend.pid) || true
        rm backend.pid
      fi
      if [ -f frontend.pid ]; then
        kill $(cat frontend.pid) || true
        rm frontend.pid
      fi
  environment:
    name: test
    url: http://localhost:5173
  artifacts:
    when: always
    paths:
      - playwright-report/
    expire_in: 7 days
  only:
    - main
    - develop
    - merge_requests
    - /^feature\/.*$/

deploy-staging:
  stage: deploy
  image: alpine:latest
  dependencies:
    - e2e-tests
  script:
    - |
      echo "Deploying to staging..."
      echo "Add your deployment commands here"
      echo "Example: kubectl apply -f k8s/staging/"
      echo "Or: docker-compose -f docker-compose.staging.yml up -d"
      echo "Note: Deployment is simulated for CI/CD comparison purposes"
  environment:
    name: staging
    url: https://staging.bmi-app.example.com
  only:
    - develop

deploy-production:
  stage: deploy
  image: alpine:latest
  dependencies:
    - e2e-tests
  script:
    - |
      echo "Deploying to production..."
      echo "Add your deployment commands here"
      echo "Example: kubectl apply -f k8s/production/"
      echo "Or: docker-compose -f docker-compose.prod.yml up -d"
      echo "Note: Deployment is simulated for CI/CD comparison purposes"
  environment:
    name: production
    url: https://bmi-app.example.com
  only:
    - main
